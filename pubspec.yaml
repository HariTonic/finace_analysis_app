name: moneyflow
description: A finance management app using Flutter and Hive.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  intl: ^0.19.0
  cupertino_icons: ^1.0.2
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  fl_chart: ^0.68.0
  http: ^1.1.0
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: logo.png
  android: true
  ios: true
  web: true
  android_12:
    color: "#FFFFFF"
    image: logo.png
